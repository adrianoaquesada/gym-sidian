name: Release

# Al etiquetar (p. ej. `git tag 1.0.1 && git push origin 1.0.1`) compila el
# plugin y crea la release de GitHub con los tres archivos que Obsidian
# descarga: main.js, manifest.json y styles.css.
# IMPORTANTE: el tag debe ser EXACTAMENTE la versión de manifest.json y SIN
# prefijo «v» (1.0.0, no v1.0.0) — el paso de abajo lo comprueba.

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear la release y subir sus archivos (el token por defecto es de solo lectura)
      id-token: write       # necesario para atestar la procedencia de la build
      attestations: write   # idem (publica la atestación en el repositorio)
    steps:
      - uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: El tag debe coincidir con manifest.json (sin «v»)
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::El tag «$TAG» no coincide con manifest.json («$VERSION»): Obsidian exige el tag exacto, sin prefijo «v»."
            exit 1
          fi

      - name: Compilar (typecheck + bundle)
        run: npm ci && npm run build

      - name: Atestar la procedencia de la build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Crear la release con los 3 archivos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
